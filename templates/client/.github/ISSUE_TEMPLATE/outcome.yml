name: Portfolio outcome
description: Coordinate an outcome that may require multiple repository-specific Issues.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: This is a coordination object only. It does not authorize or start Codex. Link one executable implementation Issue in each affected repository.
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What portfolio-level result should exist when all linked work is complete?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success conditions
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: repositories
    attributes:
      label: Repository-specific implementation Issues
      description: Add one checklist item and Issue link per repository. Use GitHub subissues when convenient.
      placeholder: "- [ ] owner/repository#123"
    validations:
      required: true
