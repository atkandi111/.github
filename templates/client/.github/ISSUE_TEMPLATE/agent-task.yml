name: Agent task
description: Propose one implementation task for the agent pipeline.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: Add the `agent` label only after this contract is ready for implementation.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that must be true.
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should this task deliberately not change?
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: ux-visual
    attributes:
      label: UX / visual constraints
      description: Optional confirmed constraints. Leave blank only when no user-visible judgment is involved.
    validations:
      required: false

