name: Implementation issue
description: Authorize one Codex implementation in this repository.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        @codex implement this issue in this repository. Open one draft pull request and complete its Merge Brief.

        Publishing this Issue is the queue action. Do not use this form for a cross-repository outcome; create one implementation Issue per repository instead.
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What observable result should this repository produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List verifiable conditions that must be true.
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and confirmed decisions
      description: Record relevant product, design, technical, or compatibility decisions.
      placeholder: "- ..."
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What must this implementation deliberately not change?
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Commands, checks, or manual evidence expected before review.
      placeholder: "- ..."
    validations:
      required: false
  - type: input
    id: parent
    attributes:
      label: Parent outcome Issue
      description: Optional link when this is one repository-specific part of a larger outcome.
    validations:
      required: false
