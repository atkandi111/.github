name: Agent implementation

# =============================================================================
# 1. AUTHORIZATION EVENT — only an `agent` label event may call the platform
# The reusable workflow performs the actor, kill-switch, and attempt checks.
# =============================================================================
on:
  issues:
    types: [labeled]

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pull-requests: write

# =============================================================================
# 2. THIN PLATFORM CALL — product context stays in this client repository
# `v1` is the reviewed, canary-gated release channel for all normal clients.
# =============================================================================
jobs:
  implement:
    if: github.event.label.name == 'agent'
    uses: YOUR_ORG/dev-platform/.github/workflows/agent.yml@v1
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
      issue_body: ${{ github.event.issue.body }}
      trigger_actor: ${{ github.actor }}
      authorized_actors: ${{ vars.AGENT_AUTHORIZED_ACTORS }}
      openai_wif_audience: ${{ vars.OPENAI_WIF_AUDIENCE }}
      openai_identity_provider_id: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
      openai_service_account_id: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
      base_ref: ${{ github.event.repository.default_branch }}
      pipeline_enabled: ${{ vars.PIPELINE_ENABLED }}
      global_pipeline_enabled: ${{ vars.AGENT_PIPELINE_ENABLED }}
      protected_paths: ${{ vars.AGENT_PROTECTED_PATHS }}
