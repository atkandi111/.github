name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: YOUR_OWNER/.github/.github/workflows/ci.yml@main
    with:
      base_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      head_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      node_version: "22"
      setup_command: npm ci
      lint_command: npm run lint
      test_command: npm test
      build_command: npm run build
      typecheck_command: npm run typecheck
