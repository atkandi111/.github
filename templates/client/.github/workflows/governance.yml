name: Governance

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    name: Governance
    uses: YOUR_OWNER/.github/.github/workflows/governance.yml@main
    with:
      record_kind: ${{ github.event_name == 'issues' && 'issue' || 'pull_request' }}
      record_title: ${{ github.event_name == 'issues' && github.event.issue.title || github.event.pull_request.title }}
      enforce: ${{ vars.GOVERNANCE_NAMING_ENFORCED == 'true' }}
