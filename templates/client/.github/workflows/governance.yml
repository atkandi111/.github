name: Governance

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    uses: YOUR_ORG/dev-platform/.github/workflows/governance.yml@main
    with:
      record_kind: ${{ github.event_name == 'issues' && 'issue' || 'pull_request' }}
      record_title: ${{ github.event_name == 'issues' && github.event.issue.title || github.event.pull_request.title }}
      base_ref: ${{ github.event.pull_request.base.ref || 'main' }}
      head_ref: ${{ github.event.pull_request.head.sha || '' }}
      head_branch: ${{ github.event.pull_request.head.ref || '' }}
      automation_prefixes: ${{ vars.GOVERNANCE_AUTOMATION_PREFIXES || 'dependabot/' }}
      legacy_branches: ${{ vars.GOVERNANCE_LEGACY_BRANCHES }}
      enforce: ${{ vars.GOVERNANCE_NAMING_ENFORCED == 'true' }}
