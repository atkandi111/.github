name: Backlog or human change
description: Record work without starting Codex.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: This form records work but does not authorize or start Codex. Use Implementation issue when publishing should enqueue the task.
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What observable result is needed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      placeholder: "- ..."
    validations:
      required: true
