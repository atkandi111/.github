name: Change request
description: Propose one focused change for human implementation.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: Use a 3-8 word, sentence-case title. Keep Status and Priority in the Project.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result is needed?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      placeholder: "- ..."
    validations:
      required: true
