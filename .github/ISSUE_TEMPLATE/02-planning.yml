name: Planning / deferred issue
description: Explicitly defer or coordinate work without starting Codex.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Planning / deferred is the explicit opt-out from the default Implementation queue. This Issue does not authorize or start Codex: do not post the implementation trigger here. Use it for backlogged or unsettled work, decisions, or a parent that coordinates repository-specific Implementation subissues.

        Planning guide: https://github.com/atkandi111/dev-platform/blob/main/docs/issue-planning.md
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What result or decision should eventually exist?
    validations:
      required: true
  - type: textarea
    id: readiness
    attributes:
      label: Readiness or success conditions
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Related or repository-specific Issues
      description: Link dependencies or subissues when applicable.
      placeholder: "- [ ] owner/repository#123"
    validations:
      required: false
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      placeholder: "- ..."
    validations:
      required: false
