name: Implementation issue
description: Publish reviewed work; the trusted implementation label queues it automatically.
labels: ["implementation"]
body:
  - type: markdown
    attributes:
      value: |
        Choose Implementation only for reviewed work that is ready to run. An owner-created Issue from this form is queued automatically when the repository pipeline is enabled. Use Planning / deferred as the explicit opt-out for backlogged, unsettled, or coordination-only work.

        Choose one cohesive, reviewable repository outcome that should normally produce one branch and one pull request. Combine tightly coupled same-repository details; split independent or cross-repository outcomes.

        Planning guide: https://github.com/atkandi111/.github/blob/main/docs/issue-planning.md
        Do not add an `@codex implement` mention: native Cloud execution would duplicate the Actions-hosted implementation run. The pipeline publishes one ready pull request with its Merge Brief; normal pull-request CI and optional Codex review follow.
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What observable result should this repository produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List verifiable conditions that must be true.
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and confirmed decisions
      description: Record relevant product, design, technical, or compatibility decisions.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What must this implementation deliberately not change?
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: documentation-impact
    attributes:
      label: Documentation impact
      description: Optional. Note any README, runbook, architecture, product, or developer guidance that may need to change with the implementation.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Commands, checks, or manual evidence expected before review.
    validations:
      required: false
  - type: textarea
    id: dependencies-overlap
    attributes:
      label: Dependencies and likely overlap
      description: Optional. Link predecessors and note sensitive files or surfaces that should not change concurrently.
      placeholder: "Dependencies: none\nLikely touchpoints: ..."
    validations:
      required: false
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      description: Optional link when this is part of a larger outcome.
    validations:
      required: false
  - type: input
    id: integration-contract
    attributes:
      label: Integration contract revision
      description: Required for cross-repository subissues. Provide the parent URL and reviewed revision; otherwise write None.
      placeholder: "https://github.com/OWNER/REPOSITORY/issues/123 @ revision 2"
    validations:
      required: false
