name: Implementation issue
description: Publish a reviewed contract; the owner delegates it later with one exact comment.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Publishing records a reviewed contract but does not start Codex. Choose one cohesive, reviewable repository outcome that should normally produce one pull request. Combine tightly coupled same-repository details; split independent or cross-repository outcomes. A parent that only coordinates subissues must use Planning / deferred instead.

        Planning guide: https://github.com/atkandi111/dev-platform/blob/main/docs/issue-planning.md
        When this repository is ready for its next implementation, the repository owner queues it by posting this exact new top-level comment without quoting or editing it:

        `@codex implement this issue in this repository. Open one draft pull request and complete its Merge Brief.`
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What observable result should this repository produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List verifiable conditions that must be true.
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and confirmed decisions
      description: Record relevant product, design, technical, or compatibility decisions.
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What must this implementation deliberately not change?
      placeholder: "- ..."
    validations:
      required: true
  - type: textarea
    id: documentation-impact
    attributes:
      label: Documentation impact
      description: Optional. Note any README, runbook, architecture, product, or developer guidance that may need to change with the implementation.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Commands, checks, or manual evidence expected before review.
    validations:
      required: false
  - type: input
    id: parent
    attributes:
      label: Parent Issue
      description: Optional link when this is part of a larger outcome.
    validations:
      required: false
