name: Reusable owner approval

on:
  workflow_call:

jobs:
  validate:
    name: Validate owner review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Bind owner approval to the current revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVIEW_URL: ${{ github.event.review.html_url }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == pull_request_review ]]
          [[ $(jq -r '.action' "$GITHUB_EVENT_PATH") == submitted ]]
          actor=$(jq -r '.sender.login' "$GITHUB_EVENT_PATH")
          reviewer=$(jq -r '.review.user.login' "$GITHUB_EVENT_PATH")
          state=$(jq -r '.review.state | ascii_downcase' "$GITHUB_EVENT_PATH")
          branch=$(jq -r '.pull_request.head.ref' "$GITHUB_EVENT_PATH")
          head_repo=$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")
          base=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          draft=$(jq -r '.pull_request.draft' "$GITHUB_EVENT_PATH")
          review_sha=$(jq -r '.review.commit_id' "$GITHUB_EVENT_PATH")
          [[ "$actor" == "$GITHUB_REPOSITORY_OWNER" && "$reviewer" == "$GITHUB_REPOSITORY_OWNER" ]] || exit 0
          [[ "$branch" =~ ^issue/[1-9][0-9]*$ && "$head_repo" == "$GITHUB_REPOSITORY" ]] || exit 0
          [[ "$draft" == false ]] || exit 0
          [[ "$base" == "$DEFAULT_BRANCH" ]]
          [[ "$review_sha" =~ ^[0-9a-f]{40}$ ]]
          current_sha=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          [[ "$review_sha" == "$current_sha" ]] || exit 0
          case "$state" in
            approved)
              status=success
              description='Repository owner approved the current revision'
              ;;
            changes_requested)
              status=failure
              description='Repository owner requested changes'
              ;;
            *) exit 0 ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$review_sha" \
            -f state="$status" -f context=atkandi/owner-approval -f description="$description" \
            -f target_url="$REVIEW_URL" >/dev/null
