name: Platform Issue pipeline
run-name: Platform Issue pipeline — ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue_number }}

on:
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Previously authorized Issue to recover.
        required: true
        type: number

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  run:
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested'
    uses: ./.github/workflows/agent.yml
    with:
      event_kind: ${{ github.event_name == 'issues' && 'issue_opened' || github.event_name == 'pull_request_review' && 'revision_requested' || 'manual' }}
      requested_issue_number: ${{ inputs.issue_number || 0 }}
      base_ref: ${{ github.event.repository.default_branch }}
      platform_ref: main
      pipeline_enabled: ${{ vars.AGENT_PIPELINE_ENABLED || 'false' }}
      auto_merge_enabled: ${{ vars.AGENT_AUTO_MERGE_ENABLED || 'false' }}
      publisher_client_id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
      protected_paths: ${{ vars.AGENT_PROTECTED_PATHS }}
      test_command: ./tests/run.sh
      max_attempts: ${{ fromJSON(vars.AGENT_MAX_ATTEMPTS || '2') }}
    secrets:
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      publisher_private_key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
