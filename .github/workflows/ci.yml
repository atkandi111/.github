name: Reusable deterministic CI

on:
  workflow_call:
    inputs:
      base_ref:
        description: Base branch used for protected-path comparison.
        required: true
        type: string
      head_ref:
        description: Full commit SHA to verify.
        required: true
        type: string
      protected_paths:
        description: Newline-separated additional paths that implementation PRs must not change.
        required: false
        default: ""
        type: string
      node_version:
        description: Node.js version to install; empty skips Node setup.
        required: false
        default: ""
        type: string
      terraform_version:
        description: Terraform version to install; empty skips Terraform setup.
        required: false
        default: ""
        type: string
      setup_command:
        required: false
        default: ""
        type: string
      lint_command:
        required: false
        default: ""
        type: string
      test_command:
        required: false
        default: ""
        type: string
      build_command:
        required: false
        default: ""
        type: string
      typecheck_command:
        required: false
        default: ""
        type: string
      extra_command:
        required: false
        default: ""
        type: string

concurrency:
  group: ci-${{ github.repository }}-${{ inputs.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Validate immutable revision input
        shell: bash
        env:
          HEAD_REF: ${{ inputs.head_ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::head_ref must be a full lowercase commit SHA"
            exit 1
          }

      - name: Check out proposed revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected paths
        shell: bash
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
          PROTECTED_PATHS: ${{ inputs.protected_paths }}
          CHANGED_FILES: ${{ runner.temp }}/changed-files.txt
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$BASE_REF" >/dev/null
          git show-ref --verify --quiet "refs/remotes/origin/$BASE_REF" || {
            echo "::error::Base branch is missing from checkout: $BASE_REF"
            exit 1
          }
          [[ $(git rev-parse HEAD) == "$HEAD_REF" ]] || {
            echo "::error::Checkout does not match the requested commit"
            exit 1
          }
          git diff --no-renames --name-only -z "origin/$BASE_REF...HEAD" > "$CHANGED_FILES"
          python3 - <<'PY'
          import fnmatch
          import os
          import pathlib
          import sys

          patterns = [
              ".github/ISSUE_TEMPLATE",
              ".github/ISSUE_TEMPLATE/**",
              ".github/workflows",
              ".github/workflows/**",
              ".github/actions",
              ".github/actions/**",
              "AGENTS.md",
              "**/AGENTS.md",
              "client-setup",
              "scripts/pipeline_policy.py",
              "scripts/portfolio_status.py",
              "scripts/reconcile-portfolio-project",
              "templates/client/.github/workflows",
              "templates/client/.github/workflows/**",
          ]
          patterns.extend(
              line.strip()
              for line in os.environ.get("PROTECTED_PATHS", "").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )
          changed = [
              os.fsdecode(path)
              for path in pathlib.Path(os.environ["CHANGED_FILES"]).read_bytes().split(b"\0")
              if path
          ]
          blocked = [
              (path, pattern)
              for path in changed
              for pattern in patterns
              if fnmatch.fnmatchcase(path, pattern)
          ]
          if blocked:
              for path, pattern in blocked:
                  display = path.encode("unicode_escape").decode("ascii")
                  print(f"::error::Protected path '{display}' matched {pattern!r}")
              sys.exit(1)
          print(f"Protected-path gate passed for {len(changed)} changed file(s).")
          PY

      - name: Set up Node.js
        if: inputs.node_version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - name: Set up Terraform
        if: inputs.terraform_version != ''
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup
        if: inputs.setup_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.setup_command }}
        run: bash -euo pipefail -c "$CI_COMMAND"

      - name: Lint
        if: inputs.lint_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.lint_command }}
        run: bash -euo pipefail -c "$CI_COMMAND"

      - name: Test
        if: inputs.test_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.test_command }}
        run: bash -euo pipefail -c "$CI_COMMAND"

      - name: Build
        if: inputs.build_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.build_command }}
        run: bash -euo pipefail -c "$CI_COMMAND"

      - name: Typecheck
        if: inputs.typecheck_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.typecheck_command }}
        run: bash -euo pipefail -c "$CI_COMMAND"

      - name: Extra repository checks
        if: inputs.extra_command != ''
        shell: bash
        env:
          CI_COMMAND: ${{ inputs.extra_command }}
        run: bash -euo pipefail -c "$CI_COMMAND"

      - name: Summarize configured checks
        shell: bash
        env:
          SETUP: ${{ inputs.setup_command }}
          NODE: ${{ inputs.node_version }}
          TERRAFORM: ${{ inputs.terraform_version }}
          LINT: ${{ inputs.lint_command }}
          TEST: ${{ inputs.test_command }}
          BUILD: ${{ inputs.build_command }}
          TYPECHECK: ${{ inputs.typecheck_command }}
          EXTRA: ${{ inputs.extra_command }}
        run: |
          set -euo pipefail
          for name in NODE TERRAFORM SETUP LINT TEST BUILD TYPECHECK EXTRA; do
            if [[ -n "${!name}" ]]; then
              echo "- $name: configured" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $name: skipped" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
